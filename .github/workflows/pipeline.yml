name: Pipeline

on:
  push:
    branches: [master, development]
  pull_request:
    branches: [master, development]

env:
  LINK: ${{ secrets.LINK }}
  TEST_PASS: ${{ secrets.TEST_PASS }}
  MAINUSER_PASS: "a"
  MAINUSER_MAIL: "a@a.se"
  MAINUSER_NAME: "a"
  SECONDUSER_PASS: "b"
  SECONDUSER_MAIL: "b@b.se"
  SECONDUSER_NAME: "b"
  THIRDUSER_PASS: "c"
  THIRDUSER_MAIL: "c@c.org"
  THIRDUSER_NAME: "c"
  FOURTHUSER_PASS: "d"
  FOURTHUSER_MAIL: "d@d.org"
  FOURTHUSER_NAME: "d"
  PUBLIC_POLL_VERSION: 2

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: flowback_test
          POSTGRES_USER: flowback
          POSTGRES_PASSWORD: flowback
        ports:
          - 5432:5432
      redis:
        image: redis:7
        ports:
          - 6379:6379
    env:
      FLOWBACK_PSQL_NAME: flowback_test
      FLOWBACK_PSQL_USER: flowback
      FLOWBACK_PSQL_PASSWORD: flowback
      FLOWBACK_PSQL_HOST: localhost
      FLOWBACK_PSQL_PORT: "5432"
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: 3.13

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      - name: Start Celery worker and beat
        run: |
          celery -A backend worker --loglevel=info &
          celery -A backend beat --loglevel=info &

      - name: Run tests
        run: pytest --disable-warnings

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          push: ${{ github.event_name == 'push' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/flowback-backend:latest

  publish:
    needs: build
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Execute remote SSH commands using password
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: 22
          script: |
            cd flowback/flowback-docker-testing
            docker compose pull && docker compose up -d

  frontend-testing:
    needs: publish
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Kattenelvis/flowback-interface-testing
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      - name: Run Smoke tests (basic login functionality for all default users)
        run: npx playwright test -g "Smoke-Test" --project chromium --retries 0
          --workers 1 --trace on
      - name: Run the rest of the tests
        run: npx playwright test . --project chromium --retries 0 --workers 1 --trace on
          --grep-invert "Smoke-Test"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30

  publish-prod:
    needs: frontend-testing
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Execute remote SSH commands using password
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: 22
          script: |
            cd flowback/flowback-docker
            docker compose pull && docker compose up -d
